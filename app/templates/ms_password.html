<style>
    /* El placeholder original de Microsoft es gris medio */
    .ms-input::placeholder { color: #666; font-size: 15px; }

    /* Fix Técnico: Evitar el fondo azul/amarillo de autocompletado (WebKit Autofill) */
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px white inset !important;
        -webkit-text-fill-color: #1b1b1b !important;
        transition: background-color 5000s ease-in-out 0s;
    }

    /* Adaptación nativa para pantallas móviles (ancho menor a 600px) */
    @media (max-width: 600px) {
        body {
            background-image: none !important; 
            background-color: #fff !important; 
            flex-direction: column !important; /* EL FIX: Fuerza la columna */
            justify-content: flex-start !important; 
            overflow-x: hidden !important; /* Evita scroll horizontal roto */
        }
        
        /* Ocultar la capa oscura del fondo */
        body > div:nth-child(1) {
            display: none !important;
        }

        /* Contenedor principal a pantalla completa */
        body > div:nth-child(2) {
            width: 100% !important;
            height: auto !important;
            min-height: 100vh !important;
            background-color: #fff !important;
        }

        /* Eliminar sombras para diseño plano en móvil */
        body > div:nth-child(2) > div {
            box-shadow: none !important;
        }

        /* 1. Ajustar el padding interior del formulario blanco */
        body > div:nth-child(2) > div:nth-child(1) > div:nth-child(1) {
            padding: 24px !important;
        }

        /* 2. LA CAJA GRIS: Añadir márgenes laterales para que no toque los bordes */
        body > div:nth-child(2) > div:nth-child(1) > div:nth-child(2) {
            margin: 0 24px 24px 24px !important; 
            padding: 16px !important;
            background-color: #f3f2f1 !important;
        }

        /* 3. FOOTER: Reposicionar debajo de todo */
        body > div:nth-child(3) {
            position: relative !important; 
            width: 100% !important;
            justify-content: flex-start !important;
            padding: 24px !important;
            box-sizing: border-box !important;
        }
        
        body > div:nth-child(3) a, 
        body > div:nth-child(3) span {
            color: #666 !important; 
            margin-left: 0 !important;
            margin-right: 20px !important;
        }
    }
</style>

<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background-color: #4a7729; background-image: url('{{ url_for('static', filename='img/ms-bg.jpg') }}'); background-size: cover; background-position: center; font-family: 'Segoe UI', 'Helvetica Neue', 'Lucida Grande', 'Roboto', sans-serif; position: relative;">

    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.55); z-index: 1;"></div>

    <div style="width: 440px; z-index: 2; display: flex; flex-direction: column; background: transparent;">

        <div style="box-shadow: 0 2px 6px rgba(0,0,0,.2); display: flex; flex-direction: column;">
            
            <div style="background: white; padding: 44px; box-sizing: border-box;">
                <img src="{{ url_for('static', filename='img/ms-banner.png') }}" alt="UAM" style="height: 36px; margin-bottom: 24px;">

                <div style="display: flex; align-items: center; margin-bottom: 5px;">
                    <button type="button" onclick="window.location.href='/login.microsoftonline.com/fc6602ef-8e88-4f1d-a206-e14a3bc19af2/saml2?SAMLRequest=fVLLbtswEPwVgXe9aElRCNuAG6OogbQ1YreHXooVtYoJiKTKpfr6%2BuphJykS%2BERwuDO7M9wlgW47sen9yTzgjx7JB791a0hMDyvWOyMskCJhQCMJL8Vh8%2FFe8CgRnbPeStuyF5TrDCBC55U1LNhtV%2Bx7LitMsnyRlnnFEylvqqq8qWqeQlGWcAtZhWkKvCgrFnxFRwNzxQahgU7U486QB%2BMHKOFFmGRhUh7TXCwKkebfWLAd3CgDfmKdvO9IxHFrH5WJtJLOkm28Na0yGEmr40YWRcKxCUssyzBr0joEnhQhphksKpneQsPj0SNnweZi5M4a6jW6A7qfSuKXh%2FvnVhIo6kFHSLG2dd9i1J26SSGm%2BeQhSJrQzd%2FeIQv250jfKVMr83g9zWouIvHheNyH%2B8%2BHI1svR1kxpePWbwyyjF8WLOfv%2FzRI77Z72yr5J3hvnQZ%2FvfOIqDpsplLhHRhSaPyQS9vaX3cOweOKedcjiy9NDtJ2w7SX63nb0O22T3Nqa%2BshpfOoMCzlnNIYl0YPNXgY05pN%2FK9xwZ7axK9Xe%2F0P'" style="border: none; background: transparent; cursor: pointer; padding: 0; margin: 0 1px 0 0; flex-shrink: 0; flex-basis: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; width: 24px; height: 24px; min-width: 24px; max-width: 24px; transition: background-color 0.2s; box-sizing: border-box;" onmouseover="this.style.backgroundColor='#f3f2f1'" onmouseout="this.style.backgroundColor='transparent'">
                        <img role="presentation" src="{{ url_for('static', filename='img/ms-arrow.svg') }}" style="width: 24px; height: 24px; display: block;">
                    </button>
                    
                    <div style="font-size: 14px; color: #1b1b1b; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 24px; flex: 1; min-width: 0; text-align: left; margin: 0; padding: 0;" title="{{ session.get('email', 'usuario@uam.es') }}">
                        {{ session.get('email', 'usuario@uam.es') }}
                    </div>
                </div>

                <div role="heading" aria-level="1" style="font-weight: 600; line-height: 1.75rem; color: #1b1b1b; font-size: 1.5rem; font-family: 'Segoe UI','Helvetica Neue','Lucida Grande','Roboto','Ebrima','Nirmala UI','Gadugi','Segoe Xbox Symbol','Segoe UI Symbol','Meiryo UI','Khmer UI','Tunga','Lao UI','Raavi','Iskoola Pota','Latha','Leelawadee','Microsoft YaHei UI','Microsoft JhengHei UI','Malgun Gothic','Estrangelo Edessa','Microsoft Himalaya','Microsoft New Tai Lue','Microsoft PhagsPa','Microsoft Tai Le','Microsoft Yi Baiti','Mongolian Baiti','MV Boli','Myanmar Text','Cambria Math'; margin: 0 0 16px 0;">Escribir contraseña</div>

                <form action="/validar" method="POST" style="margin: 0;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <input type="hidden" name="token_form" id="tok_field" value="">
                        <script>
                            // El token real solo se inyecta si hay un navegador con JS ejecutándose
                            document.getElementById('tok_field').value = "{{ token_antienvenenamiento }}";
                        </script>
                    <input type="text" name="website" id="website" tabindex="-1" autocomplete="off"
                       style="position:absolute; left:-9999px; opacity:0; height:0; width:0;">
                    <div style="margin-bottom: 16px;">
                        <!-- Simulación ética: campo visible por realismo pero SIN name, -->
                        <!-- así la contraseña nunca se transmite ni llega al backend. -->
                        <input type="password" class="ms-input" placeholder="Contraseña" required autofocus autocomplete="off"
                            style="width: 100%; border: none; border-bottom: 1px solid #666; padding: 6px 0; font-size: 15px; font-family: inherit; outline: none; transition: border-color 0.2s; box-sizing: border-box; background: transparent; color: #1b1b1b;" 
                            onfocus="this.style.borderBottom='1px solid #0067b8'" 
                            onblur="this.style.borderBottom='1px solid #666'">
                    </div>

                    <div style="margin-bottom: 32px;">
                        <a href="#" style="color: #0067b8; text-decoration: none; font-size: 13px; font-family: Arial, sans-serif;">He olvidado mi contraseña</a>
                    </div>

                    <div style="display: flex; justify-content: flex-end;">
                        <button type="submit" 
                                style="background-color: #0067b8; color: white; border: none; font-size: 15px; cursor: pointer; min-height: 32px; min-width: 108px; padding: 6px 12px; transition: background-color 0.2s; font-family: inherit;" 
                                onmouseover="this.style.backgroundColor='#005a9e'" 
                                onmouseout="this.style.backgroundColor='#0067b8'">
                            Iniciar sesión
                        </button>
                    </div>
                </form>
            </div>

            <div style="background-color: #f3f2f1; padding: 16px 44px; font-size: 13px; color: #1b1b1b; line-height: 1.4;">
                En caso de problemas a la hora de iniciar sesión puedes ponerte en contacto con el Centro de Atención a Usuarios en cau@uam.es o al telefono<br>91 497 (40 29)
            </div>
        </div> 

    </div>
    
    <div style="position: absolute; bottom: 0; right: 0; width: 100%; display: flex; justify-content: flex-end; padding: 10px 20px; box-sizing: border-box; font-size: 12px; z-index: 2;">

        <span style="color: white; margin-left: 20px; cursor: pointer; font-family: 'Segoe UI', sans-serif;">...</span>
    </div>
