services:
  # Servicio A 'El cerebro' (Flask)
  app:
    build: ./app
    container_name: flask_backend
    restart: always
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - uam_network

  # Servicio B: 'El Escudo' (Nginx)
  nginx:
    image: nginx:1.25
    environment:
      - TZ=Europe/Madrid
    container_name: nginx_proxy
    restart: always
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./app/static:/app/static
      # MAPEAMOS CERTIFICADOS REALES DEL HOST AL CONTENEDOR
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Para que Fail2ban pueda leer los logs de Nginx y bloquear IPs abusivas
      - ./nginx/logs:/var/log/nginx 
    ports:
      - "80:80"
      - "443:443" # Puerto para HTTPS (el candado verde)
    depends_on: 
      app:
        condition: service_healthy
    networks:
      - uam_network

  # Servicio C: Base de datos en memoria para sesiones seguras
  redis:
    image: redis:alpine
    container_name: redis_session
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - ./redis_data:/data
    networks:
      - uam_network

networks:
  uam_network:
    driver: bridge
