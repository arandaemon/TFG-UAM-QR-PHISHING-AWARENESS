resolver 127.0.0.11 valid=30s;
server_tokens off;

# === ZONAS DE RATE LIMITING ===
# limit_req_status 429. Nginx devolverá este código en lugar del 503 por defecto.
# Esto nos permite aislar el tráfico abusivo en los logs para que Fail2ban lo intercepte.
limit_req_status 429;

# Definimos las zonas de memoria (10m almacenan el estado de unas 160.000 IPs)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=validar:10m rate=3r/m;
limit_req_zone $binary_remote_addr zone=login_qr:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=conexiones:10m;

# REDIRECCIÓN: Si alguien entra por http (puerto 80), lo mandamos a https (443)
server {
    listen 80;
    server_name moodle.uarn.es seif.eps.uam.es;
    return 301 https://$host$request_uri;
}

# ==========================================
# BLOQUE 1: LA TRAMPA (PHISHING)
# ==========================================
server {
    listen 443 ssl;
    server_name moodle.uarn.es; 

    ssl_certificate /etc/letsencrypt/live/moodle.uarn.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/moodle.uarn.es/privkey.pem;

    # Defensas contra Slowloris y ataques de agotamiento de recursos
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # PARCHE DE SEGURIDAD: Bloqueamos la ruta del admin en el dominio falso
    location /ivan_alex_syf0954 {
        return 404; # Simulamos que esta página no existe
        access_log off; # Ni siquiera lo registramos para no hacer ruido
    }

    # El tráfico normal va a Flask
    location /login/ {
        # burst=50 permite absorber el pico instantáneo si 50 alumnos escanean el QR al mismo tiempo.
        # nodelay procesa las peticiones inmediatamente sin encolarlas artificialmente.
        limit_req zone=login_qr burst=50 nodelay;
        limit_conn conexiones 50;

        set $backend_app app;
        proxy_pass http://$backend_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /validar {
        # Restringe masivamente los envíos de formulario para matar herramientas como Burp Intruder.
        limit_req zone=validar burst=3 nodelay;
        
        set $backend_app app;
        proxy_pass http://$backend_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # El tráfico normal va a Flask
    location / {
        limit_req zone=general burst=100 nodelay;
        limit_conn conexiones 100;

        set $backend_app app;
        proxy_pass http://$backend_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tu ruta de estáticos dockerizada. 
    # INTENCIONADAMENTE SIN RATE LIMIT Evita bloqueos falsos al descargar múltiples imágenes/CSS.
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Bloqueos de OpSec
    location ~ /\.(env|git|ht) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(py|sh|sql|yml)$ {
        deny all;
    }
}

# ==========================================
# BLOQUE 2: EL CONTROL (ADMIN DASHBOARD)
# ==========================================
server {
    listen 443 ssl; 
    # Atrapamos solo el dominio oficial de la UAM
    server_name seif.eps.uam.es; 

    ssl_certificate /etc/letsencrypt/live/seif.eps.uam.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seif.eps.uam.es/privkey.pem;

    # Mismas defensas anti-Slowloris
    client_max_body_size 1m;
    client_body_timeout 10s;
    client_header_timeout 10s;

    location / {
        
        # Protegemos el panel de admin contra fuerza bruta y DoS
        limit_req zone=general burst=50 nodelay;
        limit_conn conexiones 50;

        set $backend_app app;

        proxy_pass http://$backend_app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Tu ruta de estáticos dockerizada
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Tus bloqueos de OpSec
    location ~ /\.(env|git|ht) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(py|sh|sql|yml)$ {
        deny all;
    }
    
}
