server {
    listen 8000;
    server_name localhost; 

    location / {
        proxy_pass http://app:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Corregimos la ruta de estáticos
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Bloqueo de archivos ocultos y de configuración
    location ~ /\.(env|git|ht) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueo de archivos de código fuente
    location ~* \.(py|sh|sql|yml)$ {
        deny all;
    }
    
}